name: Postman Newman API QA Pipeline

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  api-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./lms-backend/lms-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: "lms-backend/lms-backend/pom.xml"

      - name: Build Spring Boot JAR
        run: ./mvnw clean package -DskipTests

      - name: Run Spring Boot Application in Background
        run: |
          java -jar target/*.jar --server.port=8080 &
          echo "Waiting for Spring Boot application to start..."
          sleep 20

      - name: Verify Backend Readiness (Healthcheck)
        run: |
          curl --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8080/actuator/health || true

      - name: Install Node.js & Newman CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman & Reporters
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Execute Postman Newman Tests
        run: |
          newman run postman/lms_api_collection.json \
            -e postman/lms_environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman-report.html

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-api-test-report
          path: newman-report.html
