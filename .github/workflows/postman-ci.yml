name: Postman Newman API QA Pipeline

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  api-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./lms-backend/lms-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: "lms-backend/lms-backend/pom.xml"

      - name: Build Spring Boot JAR
        run: ./mvnw clean package -DskipTests

      - name: Run Spring Boot Application in Background
        run: |
          java -jar target/*.jar --server.port=8080 &
          echo "Waiting for Spring Boot application to start..."
          sleep 20

      - name: Run Spring Boot Application & Wait for Health
        run: |
          JAR_FILE=$(ls target/*.jar | grep -v 'original' | head -n 1)
          echo "Starting Spring Boot JAR: $JAR_FILE"
          
          # CI Environment එක සඳහා In-Memory H2 / Test configuration Overrides ලබා දීම
          nohup java -jar "$JAR_FILE" \
            --spring.datasource.url=jdbc:h2:mem:lmsdb;DB_CLOSE_DELAY=-1 \
            --spring.datasource.driverClassName=org.h2.Driver \
            --spring.datasource.username=sa \
            --spring.datasource.password= \
            --spring.jpa.database-platform=org.hibernate.dialect.H2Dialect \
            --spring.jpa.hibernate.ddl-auto=create-drop \
            > /tmp/app.log 2>&1 &

          echo "Waiting for Spring Boot application to start..."
          
          APP_UP=false
          for i in {1..20}; do
            if curl -s http://localhost:8080/actuator/health | grep -q "UP"; then
              echo "✅ Spring Boot is UP and Running!"
              APP_UP=true
              break
            fi
            echo "Waiting for app to boot... ($i/20)"
            sleep 3
          done

          # App එක Start වුණේ නැත්නම් Exact Logs Print කර Pipeline එක Fail කිරීම
          if [ "$APP_UP" = false ]; then
            echo "❌ Spring Boot failed to start! Dumping application logs below:"
            echo "=================== APP STARTUP LOGS ==================="
            cat /tmp/app.log
            echo "========================================================"
            exit 1
          fi
          
      - name: Install Node.js & Newman CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman & Reporters
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Execute Postman Newman Tests
        run: |
          newman run '../../postman/lms_api_collection.json' \
            -e '../../postman/lms_environment.json' \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman-report.html

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-api-test-report
          path: newman-report.html
