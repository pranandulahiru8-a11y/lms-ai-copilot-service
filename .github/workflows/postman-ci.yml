name: Postman Newman API QA Pipeline

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  api-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./lms-backend/lms-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: "lms-backend/lms-backend/pom.xml"

      - name: Build Spring Boot JAR
        run: ./mvnw clean package -DskipTests

      - name: Run Spring Boot Application in Background
        run: |
          java -jar target/*.jar --server.port=8080 &
          echo "Waiting for Spring Boot application to start..."
          sleep 20

      - name: Run Spring Boot Application & Wait for Health
        run: |
          # 1. Spring Boot executable JAR එක පමණක් තෝරාගැනීම (.original අයින් කර)
          JAR_FILE=$(ls target/*.jar | grep -v 'original' | head -n 1)
          echo "Starting Spring Boot JAR: $JAR_FILE"

          # 2. System /tmp directory එකට log එක ලියමින් background එකේ run කිරීම
          nohup java -jar "$JAR_FILE" > /tmp/app.log 2>&1 &

          # 3. App එක UP වෙනකම් තප්පර 30ක් බලන් සිටීම (Every 2s check)
          echo "Waiting for Spring Boot application to start..."
          for i in {1..15}; do
            if curl -s http://localhost:8080/actuator/health | grep -q "UP"; then
              echo "✅ Spring Boot is UP and Running!"
              break
            fi
            echo "Waiting for app to boot... ($i/15)"
            sleep 2
          done

          # 4. Startup Logs ටික Terminal එකේ Print කිරීම
          echo "=== Spring Boot Startup Logs ==="
          cat /tmp/app.log
          echo "================================"

      - name: Install Node.js & Newman CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman & Reporters
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Execute Postman Newman Tests
        run: |
          newman run '../../postman/lms_api_collection.json' \
            -e '../../postman/lms_environment.json' \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman-report.html

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-api-test-report
          path: newman-report.html
