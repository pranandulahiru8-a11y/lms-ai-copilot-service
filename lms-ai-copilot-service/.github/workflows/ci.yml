name: LMS AI Copilot CI/CD Pipeline

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          
          # Find and install requirements.txt wherever it exists in the repo
          REQ_FILE=$(find . -maxdepth 2 -name "requirements.txt" | head -n 1)
          if [ -n "$REQ_FILE" ]; then
            echo "Found requirements file at: $REQ_FILE"
            pip install --prefer-binary -r "$REQ_FILE"
          else
            echo "requirements.txt not found!"
            exit 1
          fi
          
          pip install pytest httpx

      - name: Run Pytest Suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # If pytest needs to run inside a subfolder
          if [ -d "lms-ai-copilot-service" ]; then
            cd lms-ai-copilot-service && python -m pytest -v
          else
            python -m pytest -v
          fi

  docker-build-test:
    name: Test Docker Image Build
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          if [ -f "Dockerfile" ]; then
            docker build -t lms-ai-copilot-service:test .
          elif [ -f "lms-ai-copilot-service/Dockerfile" ]; then
            docker build -t lms-ai-copilot-service:test ./lms-ai-copilot-service
          fi