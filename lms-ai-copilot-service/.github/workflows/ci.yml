name: LMS AI Copilot CI/CD Pipeline

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Debug - List Files in Runner
        run: |
          echo "=== Working Directory ==="
          pwd
          echo "=== Directory Contents ==="
          ls -la

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

          # Check root folder first, then subfolders
          if [ -f "requirements.txt" ]; then
            echo "Installing from root requirements.txt"
            pip install --prefer-binary -r requirements.txt
          elif [ -f "lms-ai-copilot-service/requirements.txt" ]; then
            echo "Installing from subfolder requirements.txt"
            pip install --prefer-binary -r lms-ai-copilot-service/requirements.txt
          else
            echo "Searching dynamically for requirements.txt..."
            REQ_PATH=$(find . -name "requirements.txt" | head -n 1)
            echo "Found path: $REQ_PATH"
            pip install --prefer-binary -r "$REQ_PATH"
          fi

          pip install pytest httpx

      - name: Run Pytest Suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -d "tests" ]; then
            python -m pytest -v
          elif [ -d "lms-ai-copilot-service/tests" ]; then
            cd lms-ai-copilot-service && python -m pytest -v
          fi
